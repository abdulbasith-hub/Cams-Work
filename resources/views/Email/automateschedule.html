<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="format-detection" content="telephone=no, date=no, address=no, email=no, url=no" />
    <title>Audit Schedule</title>

    <style type="text/css">
        table {
            border-collapse: separate;
            table-layout: fixed;
        }

        table td {
            border-collapse: collapse;
        }

        body {
            margin: 0;
            padding: 0;
            background-color: #F0F0F0;
            font-family: Arial, sans-serif;
        }

        .email-table {
            width: 100%;
            border-collapse: collapse;
        }

        .email-table th,
        .email-table td {
            border: 1px solid #ddd;
            padding: 10px;
            text-align: left;
        }

        .email-table th {
            background-color: #2971ad;
            color: white;
            font-weight: bold;
        }

        .email-table tr:nth-child(even) {
            background-color: #f9f9f9;
        }
    </style>
</head>

<body>
    <br><br>

    <table width="100%" cellpadding="0" cellspacing="0">
        <tr>
            <td align="center">

                <table width="600" cellpadding="0" cellspacing="0" style="background:#ffffff; border:2px solid #2971ad;">

                    <!-- Logo -->
                    <tr>
                        <td align="center" style="padding:20px;">
                            <img src="https://cams.tn.gov.in/site/image/tn__logo.png" width="100" />
                        </td>
                    </tr>

                    <!-- Heading -->
                    <tr>
                        <td align="center">
                            <h2 style="margin:0;">[heading]</h2>
                        </td>
                    </tr>

                    <tr>
                        <td height="20"></td>
                    </tr>

                    <!-- Greeting -->
                    <tr>
                        <td style="padding-left:20px;">
                            Dear [username],
                        </td>
                    </tr>

                    <tr>
                        <td height="15"></td>
                    </tr>

                    <!-- Message -->
                    <tr>
                        <td style="padding:20px;">
                            The audit has been scheduled for the below details. Kindly be prepared for the audit. </td>
                    </tr>

                    <!-- Table -->
                    <tr>
                        <td style="padding:0 20px;">
                            <table class="email-table">
                                <thead>
                                    <tr>

                                        <th style="width:55%;">Institution Name</th>
                                        <th style="width:35%;">Proposed Date</th>
                                    </tr>
                                </thead>
                                <tbody>

                                    <td style="text-align:left;">[instename]</td>
                                    <td style="text-align:left;">[auditperiod]</td>
                                </tbody>
                            </table>
                        </td>
                    </tr>

                    <tr>
                        <td height="20"></td>
                    </tr>

                    <!-- Footer -->


                    <tr>
                        <td style="padding:20px;">
                            Regards,<br>
                            CAMS Support Team
                        </td>
                    </tr>

                    <tr>
                        <td height="30"></td>
                    </tr>

                </table>

            </td>
        </tr>
    </table>

    <br><br>
</body>

</html>
