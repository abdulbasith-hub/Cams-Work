<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="format-detection" content="telephone=no, date=no, address=no, email=no, url=no" />
    <title>Data Verification OTP</title>
    <style type="text/css">
        table {
            border-collapse: separate;
            table-layout: fixed;
        }

        table td {
            border-collapse: collapse;
        }

        img {
            border: 0;
            height: auto;
            line-height: 100%;
            outline: none;
            text-decoration: none;
            -ms-interpolation-mode: bicubic;
        }

        body,
        a,
        li,
        p,
        h1,
        h2,
        h3 {
            -ms-text-size-adjust: 100%;
            -webkit-text-size-adjust: 100%;
            margin: 0;
            padding: 0;
        }

        a {
            text-decoration: none;
            color: inherit;
        }

        h1,
        h2,
        h3,
        p {
            line-height: inherit;
            margin: 0;
            padding: 0;
            display: inline-block !important;
            width: 100% !important;
        }
    </style>
    <link href="https://fonts.googleapis.com/css2?family=Fira+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
</head>

<body style="background-color:#F0F0F0; font-family:'Fira Sans', Arial, sans-serif;">
    <br><br>
    <table width="100%" bgcolor="#F0F0F0" cellpadding="0" cellspacing="0">
        <tr>
            <td align="center">
                <table width="600" bgcolor="#FFFFFF" cellpadding="0" cellspacing="0" style="max-width:600px; width:100%;border:2px solid #2971ad;">
                    <tr>
                        <td height="60"></td>
                    </tr>
                    <tr>
                        <td align="center">
                            <img src="https://cams.tn.gov.in/site/image/tn__logo.png" width="120" height="120" alt="Logo" style="display:block;" />
                        </td>
                    </tr>
                    <tr>
                        <td height="20"></td>
                    </tr>
                    <tr>
                        <td align="center">
                            <h1 style="font-size: 32px; font-weight: 700; color: #000;">Data Verification OTP</h1>
                        </td>
                    </tr>
                    <tr>
                        <td height="30"></td>
                    </tr>
                    <tr>
                        <td align="left">
                            <p style="padding-left:30px;padding-bottom:15px;font-size:16px; font-weight: 500; color: #666; max-width: 350px;">Dear [username],</p>
                        </td>
                    </tr>
                    <tr>
                        <td align="left">
                            <p style="font-size: 16px; font-weight: 500; color: #666; max-width: 500px; line-height: 1.6;padding:10px;padding-left:30px;">We have received a request to finalize data verification.</p>
                        </td>
                    </tr>
                    <tr>
                        <td align="left">
                            <p style="font-size: 16px; font-weight: 500; color: #666; max-width: 500px; line-height: 1.6;padding:10px;padding-left:30px;">Kindly use the below verification code to continue.</p>
                            <br>
                            <h5 style="text-align:center;color:rgb(1, 1, 110);font-size:25px;letter-spacing:18px;">[rand_otp]</h5>
                        </td>
                    </tr>
                    <tr>
                        <td align="left" style="padding:30px;">
                            <p style="font-size: 16px; color: #BBB; max-width: 500px;line-height: 1.6;"><b>Important Notes</b><br>For security reasons, please dont share the OTP with anyone.</p>
                        </td>
                    </tr>
                    <tr>
                        <td align="left">
                            <p style="padding-left:30px;padding-bottom:15px;font-size:16px; font-weight: 500; color: #666; max-width: 350px;line-height: 2.2;">Thank you,<br>CAMS Support Team</p>
                        </td>
                    </tr>
                    <tr>
                        <td height="60"></td>
                    </tr>
                </table>
            </td>
        </tr>
    </table>
    <br><br>
</body>

</html>
